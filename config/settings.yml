# 更多配置请前往源码位置：config/config中查阅
settings:
  application:
    Author: Jason
    # dev开发环境 test测试环境 prod线上环境
    mode: dev
    # 服务器ip，默认使用 0.0.0.0
    host: 0.0.0.0
    # 服务名称
    name: admin-api
    # 版本
    version: 2.0.0
    # 端口号
    port: 8888 # 服务端口号
    # 数据权限功能开关
    enableDP: false
    # file根目录地址，不能是static，不能以./或/开头，只可输入：英文和/
    fileRootPath: files/
    # 是否单点登录
    isSingleLogin: false
    # 用于从restapi获取定位信息，方便定位每个登录用户的具体信息，若不配置，则相关信息返回空
    ampKey: ---
  logger:
    # 日志存放路径
    path: files/logs
    # 日志输出，file：文件，default：命令行，其他：命令行
    stdout: '' #控制台日志，启用后，不输出到文件
    # 日志等级, trace, debug, info, warn, error, fatal
    level: trace
    # 数据库日志开关
    enabledDB: false
    # 支持default、zap、logrus
    type: default
    # 单文件条数
    cap: 100
  auth:
    # token 过期时间 单位：秒，默认2小时
    timeout: 7200
    # token最大过期时间，单位：秒，在此期间刷新token。默认7天
    maxRefresh: 604800
    # JWT token 密钥，生产环境必填，长度任意（建议 32 字节以上随机值）。
    # 服务启动时会校验：禁止为空、禁止使用占位符、禁止使用历史默认值。
    # 建议通过环境变量注入，勿提交真实密钥到仓库。
    secret: d088b80a2809f5d7a9c6f36245f0740496bf398d0185a976b68f77c34b710167
    # AES 数据加密密钥（用于手机号/邮箱等字段加密），生产环境必填。
    # 长度必须为 16/24/32 字节（AES-128/192/256），且必须与 secret 不同。
    # 若已有存量密文数据，更换密钥前需先做解密-重加密迁移。
    secretAes: abbb8bce80fd725092e5d998a6010b05050ff08a8c60898d257be448a553552a
    # 是否进行设备检查
    enableDeviceCheck: true
    # 是否开启黑名单
    enableBlacklist: true
    # 最多允许几台设备登录，需enableDeviceCheck开启
    maxDeviceCount: 2
  database:
    # 目前支持：mysql postgres
    driver: postgres
    # mysql 数据库连接dns
    # source: 账号:密码@tcp(ip:端口号)/数据库名?charset=utf8&parseTime=True&loc=Local&timeout=1000ms
    # postgres 数据库连接dns
    source: host=127.0.0.1 port=5432 user=postgres dbname=public password=123456 sslmode=disable TimeZone=Asia/Shanghai default_query_exec_mode=simple_protocol
  #  多db服务，下方配置未完善，待定，先占位
  #  databases:
  #    'locaohost:8888':
  #      driver: mysql
  #        # 数据库连接字符串 mysql 缺省信息 charset=utf8&parseTime=True&loc=Local&timeout=1000ms
  #        source: user:password@tcp(127.0.0.1:3306)/dbname?charset=utf8&parseTime=True&loc=Local&timeout=1000ms
  #      registers:
  #        - sources:
  #            - user:password@tcp(127.0.0.1:3306)/dbname?charset=utf8&parseTime=True&loc=Local&timeout=1000ms
  gen:
    # 代码生成是使用前端代码存放位置，需要指定到src文件夹，相对路径
    frontPath: ./web/src
  cache:
    # 缓存默认时间 单位：秒
    expired: 300
    # 若注释掉redis的内容，默认将使用内存缓存，下方配置一般使用前两个，剩余配置按需设置
#    redis:
#      addr: 127.0.0.1:6379
#      password: 密码
#      network:
#      username:
#      db:
#      pool_size:
#      tls:
#      max_retries:
  queue:
    memory:
      poolSize: 100
#    其余第三方队列服务，下方配置未完善，待定，先占位
#    redis:
#      addr: 127.0.0.1:6379
#      password: xxxxxx
#      producer:
#        streamMaxLength: 100
#        approximateMaxLength: true
#      consumer:
#        visibilityTimeout: 60
#        bufferSize: 100
#        concurrency: 10
#        blockingTimeout: 5
#        reclaimInterval: 1
#  主要是redis锁服务，下方配置未完善，待定，先占位
#  locker:
#    redis:
  rateLimiter:
    # IP访问速率限制开关
    enabled: true
    # 单个IP在周期内允许的最大请求数
    limit: 100
    # 周期 单位：秒
    period: 60
    # IP黑名单，支持IP和CIDR网段，如 192.168.1.1 或 10.0.0.0/8
    blacklist:
#      - 192.168.1.100
#      - 10.0.0.0/8
    # 若配置redis，则使用redis存储计数，支持多实例；不配置则使用内存存储
#    redis:
#      addr: 127.0.0.1:6379
#      password: 密码
#      db: 0
