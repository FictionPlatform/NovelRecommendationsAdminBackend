      - 书友关注
  /app/novel/home:
    get:
      consumes:
      - application/json
      description: 首页聚合
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      summary: 首页聚合：精选+热门TOP+最新/热门话题（无需登录）
      tags:
