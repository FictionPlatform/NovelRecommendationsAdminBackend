basePath: /web-api/v1
definitions:
  dto.NovelAuthLoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.NovelAuthRegisterReq:
    properties:
      avatar:
        type: string
      password:
        maxLength: 64
        minLength: 6
        type: string
      username:
        maxLength: 64
        minLength: 2
        type: string
    required:
    - password
    - username
    type: object
  dto.NovelBookDeleteReq:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  dto.NovelBookInsertReq:
    properties:
      author:
        type: string
      category:
        type: string
      chapters:
        type: integer
      cover:
        type: string
      description:
        type: string
      isFeatured:
        type: integer
      publishDate:
        type: string
      readUrl:
        type: string
      serialStatus:
        type: string
      slogan:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      wordCount:
        type: integer
    type: object
  dto.NovelBookUpdateReq:
    properties:
      author:
        type: string
      category:
        type: string
      chapters:
        type: integer
      cover:
        type: string
      description:
        type: string
      isFeatured:
        type: integer
      publishDate:
        type: string
      readUrl:
        type: string
      serialStatus:
        type: string
      slogan:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      wordCount:
        type: integer
    type: object
  dto.NovelFeedbackInsertReq:
    properties:
      content:
        type: string
      kind:
        type: string
      type:
        type: string
    type: object
  dto.NovelFollowInsertReq:
    properties:
      targetUserId:
        type: integer
    type: object
  dto.NovelNotificationReadReq:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  dto.NovelPostCommentInsertReq:
    properties:
      content:
        type: string
      parentId:
        type: integer
      replyToCommentId:
        type: integer
      replyToUser:
        type: string
    type: object
  dto.NovelPostDeleteReq:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  dto.NovelPostInsertReq:
    properties:
      content:
        type: string
      refBookId:
        type: integer
      title:
        type: string
      topicTag:
        type: string
    type: object
  dto.NovelPostInteractReq:
    properties:
      action:
        type: string
      type:
        type: string
    type: object
  dto.NovelProfileUpdateReq:
    properties:
      avatar:
        type: string
      bio:
        type: string
      email:
        type: string
      nickname:
        type: string
      notifyBookUpdate:
        type: integer
      notifyComment:
        type: integer
      preferredCategories:
        items:
          type: string
        type: array
    type: object
  dto.NovelReviewDeleteReq:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  dto.NovelReviewInsertReq:
    properties:
      bookId:
        type: integer
      content:
        type: string
      rating:
        type: integer
    type: object
  dto.NovelShelfInsertReq:
    properties:
      bookId:
        type: integer
    type: object
  response.Response:
    properties:
      code:
        type: integer
      msg:
        type: string
      requestId:
        description: 数据集
        type: string
    type: object
host: localhost:8888
info:
  contact: {}
  description: 小说推荐平台读者端接口（/web-api/v1/app/novel/**，读公开、写需登录）
  title: 墨读·小说引力场 读者端 API
  version: 2.0.0
paths:
  /app/novel/book:
    delete:
      consumes:
      - application/json
      description: 删除小说（级联书评/书架，话题关联置空；权限 novel:book:del）
      parameters:
      - description: 请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.NovelBookDeleteReq'
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 删除小说
      tags:
      - 小说书库
    get:
      consumes:
      - application/json
      description: 分页查询小说书库（分类/连载状态/字数区间/关键字/排序）
      parameters:
      - description: 页码
        in: query
        name: pageIndex
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        type: integer
      - description: 分类
        in: query
        name: category
        type: string
      - description: 连载状态
        in: query
        name: serialStatus
        type: string
      - description: 上架状态
        in: query
        name: status
        type: string
      - description: 首页精选
        in: query
        name: isFeatured
        type: integer
      - description: 字数下限
        in: query
        name: wordCountMin
        type: integer
      - description: 字数上限
        in: query
        name: wordCountMax
        type: integer
      - description: 关键字（书名/作者/标签）
        in: query
        name: keyword
        type: string
      - description: 排序 rating|click|latest
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 分页查询小说书库
      tags:
      - 小说书库
    post:
      consumes:
      - application/json
      description: 新增小说（内容管理，权限 novel:book:add）
      parameters:
      - description: 请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.NovelBookInsertReq'
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 新增小说
      tags:
      - 小说书库
  /app/novel/book-review:
    delete:
      consumes:
      - application/json
      description: 仅本人可删除
      parameters:
      - description: 请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.NovelReviewDeleteReq'
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 删除我的书评
      tags:
      - 小说书评
    post:
      consumes:
      - application/json
      description: 新增书评并联动书籍评分（事务聚合）
      parameters:
      - description: 请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.NovelReviewInsertReq'
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 新增书评
      tags:
      - 小说书评
  /app/novel/book-review/page:
    get:
      consumes:
      - application/json
      description: filter=all 全部 five 5星 hot 热门
      parameters:
      - description: 页码
        in: query
        name: pageIndex
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        type: integer
      - description: 书籍编号
        in: query
        name: bookId
        type: integer
      - description: all|five|hot
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      summary: 书评圈分页查询
      tags:
      - 小说书评
  /app/novel/book/{id}:
    get:
      consumes:
      - application/json
      description: 查询小说详情（含最新书评，点击+1）
      parameters:
      - description: 书籍编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 查询小说详情
      tags:
      - 小说书库
    put:
      consumes:
      - application/json
      description: 更新小说（内容管理，权限 novel:book:edit）
      parameters:
      - description: 书籍编号
        in: path
        name: id
        required: true
        type: integer
      - description: 请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.NovelBookUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 更新小说
      tags:
      - 小说书库
  /app/novel/book/rank:
    get:
      consumes:
      - application/json
      description: type=rating 综合评分榜 type=click 点击热度榜
      parameters:
      - description: rating|click
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 查询小说榜单
      tags:
      - 小说书库
  /app/novel/bookshelf:
    get:
      consumes:
      - application/json
      description: 当前登录用户书架
      parameters:
      - description: 页码
        in: query
        name: pageIndex
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 分页查询我的书架
      tags:
      - 我的书架
    post:
      consumes:
      - application/json
      description: 重复加入幂等返回
      parameters:
      - description: 请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.NovelShelfInsertReq'
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 加入书架
      tags:
      - 我的书架
  /app/novel/bookshelf/{id}:
    delete:
      consumes:
      - application/json
      description: 仅本人可移除
      parameters:
      - description: 书架记录编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 移除书架
      tags:
      - 我的书架
  /app/novel/feedback:
    post:
      consumes:
      - application/json
      description: type=A~H；kind=feedback 反馈 / complaint 投诉；提交成功自动生成系统通知
      parameters:
      - description: 请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.NovelFeedbackInsertReq'
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 提交意见反馈/投诉
      tags:
      - 意见反馈
  /app/novel/feedback/page:
    get:
      consumes:
      - application/json
      description: kind=feedback 我的反馈 / complaint 我的投诉，为空查全部
      parameters:
      - description: 页码
        in: query
        name: pageIndex
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        type: integer
      - description: feedback|complaint
        in: query
        name: kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 分页查询我的反馈/投诉
      tags:
      - 意见反馈
  /app/novel/follow:
    post:
      consumes:
      - application/json
      description: 关注目标用户（幂等，已关注返回提示码）
      parameters:
      - description: 请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.NovelFollowInsertReq'
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
