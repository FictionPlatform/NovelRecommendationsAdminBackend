      - 小说长文
  /app/novel/post-comment/mine:
    get:
      consumes:
      - application/json
      description: 当前登录用户的话题评论（含原帖标题）
      parameters:
      - description: 页码
        in: query
        name: pageIndex
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 分页查询我的评论
      tags:
      - 小说长文
  /app/novel/post/{id}:
    get:
      consumes:
      - application/json
      description: 话题详情（含楼中楼评论与当前用户互动状态）
      parameters:
      - description: 话题编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      summary: 查询话题详情
      tags:
      - 小说长文
  /app/novel/post/{id}/comment:
    post:
      consumes:
      - application/json
      description: 支持楼中楼（parentId）与 @昵称（replyToUser）
      parameters:
