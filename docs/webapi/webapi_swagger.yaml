            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 关注书友
      tags:
      - 书友关注
  /app/novel/follow/{targetUserId}:
    delete:
      consumes:
      - application/json
      description: 取消对目标用户的关注
      parameters:
      - description: 被关注用户编号
        in: path
        name: targetUserId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 请求成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - Bearer: []
      summary: 取消关注
      tags:
      - 书友关注
  /app/novel/following:
    get:
      consumes:
      - application/json
      description: 当前登录用户已关注的书友（含画像）
      parameters:
      - description: 页码
        in: query
        name: pageIndex
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        type: integer
      produces:
